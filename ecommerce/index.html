<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple E-Commerce Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#2c3e50;
    color:#fff;
    text-align:center;
    padding:20px;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
}

.products{
    flex:3;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.product{
    background:#fff;
    padding:15px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.product img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:8px;
}

.product h3{
    margin:10px 0;
}

.price{
    color:green;
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

button{
    background:#27ae60;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1f8b4d;
}

.cart{
    flex:1;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.cart ul{
    list-style:none;
    margin-top:15px;
}

.cart li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.remove{
    background:red;
    padding:5px 10px;
}

.remove:hover{
    background:darkred;
}

@media(max-width:768px){

.container{
    flex-direction:column;
}

}
</style>

</head>
<body>

<header>
<h1>🛒 Simple E-Commerce Store</h1>
</header>

<div class="container">

<div class="products" id="products"></div>

<div class="cart">
<h2>Shopping Cart</h2>
<ul id="cartItems"></ul>
<hr><br>
<h3>Total: £<span id="total">0</span></h3>
</div>

</div>

<script>

const products=[
{
id:1,
name:"Laptop",
price:700,
image:"https://picsum.photos/200?random=1"
},
{
id:2,
name:"Headphones",
price:80,
image:"https://picsum.photos/200?random=2"
},
{
id:3,
name:"Smartphone",
price:500,
image:"https://picsum.photos/200?random=3"
},
{
id:4,
name:"Smart Watch",
price:150,
image:"https://picsum.photos/200?random=4"
}
];

let cart=[];

const productsContainer=document.getElementById("products");
const cartItems=document.getElementById("cartItems");
const total=document.getElementById("total");

function loadProducts(){

products.forEach(product=>{

const card=document.createElement("div");

card.className="product";

card.innerHTML=`
<img src="${product.image}" alt="${product.name}">
<h3>${product.name}</h3>
<div class="price">£${product.price}</div>
<button>Add to Cart</button>
`;

card.querySelector("button").addEventListener("click",()=>{

cart.push(product);

updateCart();

});

productsContainer.appendChild(card);

});

}

function updateCart(){

cartItems.innerHTML="";

let sum=0;

cart.forEach((item,index)=>{

sum+=item.price;

const li=document.createElement("li");

li.innerHTML=`
<span>${item.name} (£${item.price})</span>
<button class="remove">X</button>
`;

li.querySelector("button").addEventListener("click",()=>{

cart.splice(index,1);

updateCart();

});

cartItems.appendChild(li);

});

total.textContent=sum;

}

loadProducts();

</script>

</body>
</html>
